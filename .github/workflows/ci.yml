name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit and smoke tests (no scored run in CI)
        run: python -m pytest tests/ -q
      - name: Byte-compile all code
        run: python -m compileall -q src scripts
      - name: House style check (no em dash in Markdown)
        run: |
          if grep -rn $'\u2014' --include='*.md' . ; then
            echo "em dash found in Markdown" && exit 1
          fi
          echo "no em dash in Markdown"
